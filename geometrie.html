  <main class="container">
     <h1>Geometrie vizuală</h1>
     <p>O colecție de figuri desenate vectorial, utile pentru a înțelege conceptele de bază.</p>

    <div class="svg-grid">
      <!-- Cerc -->
      <figure>
        <svg viewBox="0 0 120 120" role="img" aria-label="Cerc">
          <circle cx="60" cy="60" r="40" class="fill-1" />
          <line x1="60" y1="60" x2="100" y2="60" class="axis" />
        </svg>
        <figcaption>Cerc (r = 40)</figcaption>
      </figure>

      <!--  Dreptunghi -->
      <figure>
        <svg viewBox="0 0 160 100" role="img" aria-label="Dreptunghi">
          <rect x="20" y="20" width="120" height="60" rx="6" class="fill-2" />
          <text x="80" y="55" text-anchor="middle" class="label">l × L</text>
        </svg>
        <figcaption>Dreptunghi (120×60)</figcaption>
      </figure>

      <!--  Triunghi  -->
      <figure>
        <svg viewBox="0 0 120 110" role="img" aria-label="Triunghi">
          <polygon points="10,100 110,100 60,20" class="fill-3" />
          <line x1="10" y1="100" x2="110" y2="100" class="axis" />
        </svg>
        <figcaption>Triunghi isoscel</figcaption>
      </figure>

      <!--  Elipsă -->
      <figure>
        <svg viewBox="0 0 160 120" role="img" aria-label="Elipsă">
          <ellipse cx="80" cy="60" rx="60" ry="35" class="fill-4" />
          <line x1="20" y1="60" x2="140" y2="60" class="axis" />
        </svg>
        <figcaption>Elipsă</figcaption>
      </figure>

      <!--  Linie + săgeți -->
      <figure>
        <svg viewBox="0 0 200 80" role="img" aria-label="Segment orientat">
          <defs>
            <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
              <polygon points="0 0, 10 3, 0 6" />
            </marker>
          </defs>
          <line x1="20" y1="40" x2="180" y2="40" class="axis" marker-end="url(#arrow)" />
        </svg>
        <figcaption>Segment cu săgeată</figcaption>
      </figure>

      <!-- 6. Poligon neregulat  -->
      <figure>
        <svg viewBox="0 0 140 120" role="img" aria-label="Poligon neregulat">
          <polyline points="10,110 40,40 70,90 100,20 130,110" class="poly" />
        </svg>
        <figcaption>Poligon neregulat</figcaption>
      </figure>
    </div>
  </main>
